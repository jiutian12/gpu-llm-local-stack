general_settings:
  master_key: sk-lm-REPLACE_ME
  # 用量/花费记录到 PostgreSQL，支撑 UI Usage 用量页与 Keys 管理
  database_url: postgresql://litellm:litellm@localhost:5432/litellm
  # 把完整请求/响应内容写入 PostgreSQL LiteLLM_SpendLogs.messages / response
  # （Grafana「实时输入输出瀑布流」面板的数据源）
  # 注意：必须放在 general_settings 下，litellm 从 general_settings 读取该开关
  store_prompts_in_spend_logs: true

litellm_settings:
  drop_params: true
  num_retries: 0
  request_timeout: 1800
  require_auth_for_metrics_endpoint: false
  # Claude 端点走 chat/completions
  use_chat_completions_url_for_anthropic_messages: true
  # Claude Code auto mode 的安全分类器只给 ~64 token 输出预算，推理模型会把预算
  # 全花在思维链上 -> content 为空 -> 拿不到判决 -> fail-closed 拒绝（表现为"auto 了还停下来问人"）。
  # 该 hook 只对 max_tokens<=128 的请求注入 chat_template_kwargs={"enable_thinking": false}，
  # 主 agent（max_tokens 32768）不受影响，思维链照常保留。
  # ① classifier_no_think: 只对 max_tokens<=128 的分类器请求关掉思维链（见文件头注释）
  # ② image_history_trim : Claude Code 每轮重发整个历史，图片会累积；
  #    单请求超过 vLLM 的 --limit-mm-per-prompt count 上限就 400「At most 16 image(s)」。
  #    该 hook 把最旧的图片块换成文本占位符，使请求能继续走。
  #    可调: LITELLM_IMG_TRIM_MAX(默认16) / LITELLM_IMG_TRIM_KEEP(默认14) / _DEBUG=1
  callbacks: ["litellm_automode_fix.classifier_no_think",
              "litellm_image_history_trim.image_history_trim"]
  # 同时输出 Prometheus 指标到 /metrics
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
