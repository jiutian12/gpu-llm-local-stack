# LiteLLM Proxy 配置 (由 start_litellm.sh 引用)
# 后端: vLLM 单用户模式 @ http://127.0.0.1:18020  （qwen3.8-27B-W4A16 + DFlash2 投机解码）
#   启动方式: bash ~/qwen-serving/setup/07_start.sh
#   注意: vLLM 当前 --max-model-len = 200000（CTX=huge, MAX_LEN=200000, KV_MEM=4.4GB），
#         所以下面 5 个模型别名的上下文元数据统一写 200000。三处必须一致，否则客户端会发超长 prompt 被后端拒：
#           ① vLLM  --max-model-len 200000
#           ② litellm  max_input_tokens / max_tokens = 200000（本文件）
#           ③ Claude Code 客户端窗口（claude-sonnet-4-6 默认即 200k；实测 claude -p "/context" -> 27k/200k）
#         复核实际运行参数: wsl -d Ubuntu -e bash -lc "ps -eo args | grep 'vllm serve'"
#         历史档位: 240k(245760) -> 200k -> 230k -> 200k (2026-09-12 17:00 定版，优先保显存余量)
#   旧的 llama-server 链路（vision_guard:1237 -> llama-server:1235）已不再作为默认后端；
#   如需回退，把 api_base 改回 http://127.0.0.1:1237/v1 并重启 litellm。
#   备份: litellm_config.yaml.bak-20260910-vllm
# 对外: 1234 端口, 统一 OpenAI + Anthropic 格式
# UI : http://localhost:1234/ui  (登录密码 = master_key, 监控 token 用量)

model_list:
  - model_name: qwen3-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://127.0.0.1:18020/v1
      api_key: sk-lm-REPLACE_ME
      max_tokens: 65536
    # 本地部署无费用，token 用量照常记录；如需展示金额可填价格(每 token)
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      # 显式声明能力: 否则 /model/info 全返回 null, 客户端会判定不支持工具调用而禁用 auto mode
      supports_function_calling: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_system_messages: true
      supports_assistant_prefill: true
      supports_reasoning: true
      supports_prompt_caching: true
      supports_response_schema: true
      supports_native_streaming: true
      supports_vision: true
      supports_computer_use: true
      supports_audio_input: false
      supports_audio_output: false
      supports_pdf_input: false
      supports_web_search: false
      # 补全上下文窗口元数据: 否则 /v1/models 返回 null, 客户端无法判断模型能力
      max_input_tokens: 200000
      max_tokens: 200000
      max_output_tokens: 32768

